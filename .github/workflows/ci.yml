name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  automation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: node --test .github/scripts/*.test.cjs
      - run: node .github/scripts/check-doc-language.cjs
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: "1.27.x"
            test_flags: "-race"
          - os: windows-latest
            go: "1.27.x"
            test_flags: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install pinned build tools
        working-directory: tools/darabonba
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check official semantic frontend and complete product IR offline
        working-directory: tools/darabonba
        run: npm run check
      - name: Test frontend, normalization and complete discovery contracts
        working-directory: tools/darabonba
        run: npm test
      - name: Rehearse real STS source drift, safe rejection and reviewed regeneration
        shell: bash
        run: |
          node tools/darabonba/rehearse-sts.cjs .git/sts-source-rehearsal
          if go run ./internal/cmd/sdkgen product-generate -root .git/sts-source-rehearsal/candidate; then exit 1; fi
          test ! -d .git/sts-source-rehearsal/candidate/service
          if go run ./internal/cmd/sdkgen product-generate -root .git/sts-source-rehearsal/baseline -operations sts/AssumeRole; then exit 1; fi
          test ! -d .git/sts-source-rehearsal/baseline/service
          cp .git/sts-source-rehearsal/reviewed-sts-policy.json .git/sts-source-rehearsal/candidate/policies/sts.json
          go run ./internal/cmd/sdkgen product-generate -root .git/sts-source-rehearsal/candidate
          go run ./internal/cmd/sdkgen product-check -root .git/sts-source-rehearsal/candidate
          node tools/darabonba/rehearse-sts.cjs --runtime .git/sts-source-rehearsal/candidate
          go -C .git/sts-source-rehearsal/candidate test ${{ matrix.test_flags }} ./service/sts
      - name: Check formatting
        shell: bash
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi
      - name: Check documentation and JSON v2 policy
        run: go run ./internal/cmd/doccheck
      - name: Check complete product emission offline (single service path)
        run: go run ./internal/cmd/sdkgen product-check
      - name: Vet
        run: go vet ./...
      - name: Test packages and runnable examples
        run: go test ${{ matrix.test_flags }} -timeout 20m ./...
      - name: Test isolated STS consumer and pinned official-v2 comparison
        run: go -C examples/stsacceptance test ${{ matrix.test_flags }} ./...
      - name: Run account-free STS consumer
        run: go -C examples/stsacceptance run .
      - name: Test isolated generated product consumers
        run: go -C examples/productacceptance test ${{ matrix.test_flags }} ./...
      - name: Run account-free product consumer
        run: go -C examples/productacceptance run .
      - name: Test isolated SDK benchmark workloads (no timing gate)
        run: go -C tools/benchmarks test ${{ matrix.test_flags }} ./...
      - name: Vet isolated SDK benchmark workloads
        run: go -C tools/benchmarks vet ./...
