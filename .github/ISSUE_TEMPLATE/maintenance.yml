name: Maintenance
description: Improve repository or CI tooling / 改进仓库与 CI
title: "[Maintenance]: "
labels: [maintenance, "status:triage"]
body:
  - type: dropdown
    id: areas
    attributes:
      label: Affected areas
      description: Select all responsibilities / 选择相关职责
      multiple: true
      options:
        - core
        - credentials
        - transport
        - signing
        - ecs
        - tools
        - middleware
        - endpoints
        - waiter
        - testing
        - sts
        - telemetry
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and evidence
      description: Explain the user impact and cite sources / 说明影响并提供证据
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and dependencies
      description: State behavior, prerequisites and exclusions / 说明行为、前置与排除项
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable outcomes / 列出可观察结果
    validations:
      required: true
  - type: textarea
    id: docs
    attributes:
      label: Documentation requirements
      description: English Go comments and equivalent bilingual guides / 英文注释与对应双语指南
    validations:
      required: true
