name: Feature proposal
description: 在实现前确定新的 API 或能力
title: "[Feature]: "
labels: [enhancement, 'status:triage']
body:
  - type: dropdown
    id: areas
    attributes:
      label: Affected areas
      description: 这些是单一 Go module 内的职责分组，可多选。
      multiple: true
      options:
        - core
        - credentials
        - transport
        - signing
        - ecs
        - tools
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题与使用场景
      description: 先说明用户需求，再说明方案。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 证据与来源
      description: 官方协议/schema 版本、上游 issue 或当前限制。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围与方案
      description: 拟议 API、替代方案、前置 issue 和明确排除的内容。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收条件
      description: 使用可观察的结果或测试说明完成标准，列出前置依赖。
    validations:
      required: true
  - type: textarea
    id: docs
    attributes:
      label: pkg.go.dev 文档要求
      description: 指定 doc.go、导出符号及字段注释、可执行外部 Example、README 的交付；无需修改时解释原因。
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 已搜索现有 issue 与路线图。
          required: true
        - label: 已移除凭据及私有数据。
          required: true
