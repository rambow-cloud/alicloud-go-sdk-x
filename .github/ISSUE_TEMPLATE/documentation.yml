name: Documentation
description: Improve paired guides and pkg.go.dev
title: "[Docs]: "
labels: [documentation, "status:triage"]
body:
  - type: dropdown
    id: areas
    attributes:
      label: Affected areas
      description: Select all responsibilities
      multiple: true
      options:
        - core
        - credentials
        - transport
        - signing
        - ecs
        - vpc
        - tools
        - middleware
        - endpoints
        - waiter
        - testing
        - sts
        - telemetry
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and evidence
      description: Explain the user impact and cite sources
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and dependencies
      description: State behavior, prerequisites and exclusions
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable outcomes
    validations:
      required: true
  - type: textarea
    id: docs
    attributes:
      label: Documentation requirements
      description: English Go comments and equivalent bilingual guides
    validations:
      required: true
