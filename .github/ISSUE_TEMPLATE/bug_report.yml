name: Bug report
description: 报告可复现的行为缺陷
title: "[Bug]: "
labels: [bug, 'status:triage']
body:
  - type: dropdown
    id: areas
    attributes:
      label: Affected areas
      description: 这些是单一 Go module 内的职责分组，可多选。
      multiple: true
      options:
        - core
        - credentials
        - transport
        - signing
        - ecs
        - tools
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题与影响
      description: 实际行为、预期行为和受影响用户。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 复现与证据
      description: 最小 Go 示例、SDK/Go 版本及协议来源；只使用脱敏数据。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围
      description: 需要修复什么，哪些情况不在本 issue 内。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收条件
      description: 使用可观察的结果或测试说明完成标准，列出前置依赖。
    validations:
      required: true
  - type: textarea
    id: docs
    attributes:
      label: pkg.go.dev 文档要求
      description: 指定 doc.go、导出符号及字段注释、可执行外部 Example、README 的交付；无需修改时解释原因。
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 已搜索现有 issue 与路线图。
          required: true
        - label: 已移除凭据及私有数据。
          required: true
